<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公开资源索引</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><b>公开资源索引</b><span>仅收录经授权或可合法分享的公开资料</span></div><button id="add">提交资源</button></header>
<main><section class="hero"><h1>简洁、可追溯的公开分享目录</h1><p>按标题、标签或说明检索。每条记录均提供原始来源与授权说明，不自动抓取文件，不收集访问密码。</p><div class="search"><input id="q" placeholder="搜索标题、标签、内容说明"><select id="cat"><option value="">全部分类</option><option>文档</option><option>课程</option><option>开源软件</option><option>影音</option><option>其他</option></select></div></section>
<section id="stats"></section><section id="grid" class="grid"></section><div id="empty" class="empty">暂无符合条件的资源</div></main>
<dialog id="dlg"><form id="form"><h2>提交公开资源</h2><p class="hint">请仅提交你有权公开分享的内容。本站不接受绕过访问控制、泄露密码或侵权内容。</p><label>标题<input name="title" required maxlength="120"></label><label>内容说明<textarea name="description" maxlength="1200"></textarea></label><div class="two"><label>分享网址<input name="share_url" type="url" required></label><label>原始来源网址<input name="source_url" type="url" required></label></div><div class="two"><label>分类<select name="category"><option>文档</option><option>课程</option><option>开源软件</option><option>影音</option><option>其他</option></select></label><label>标签<input name="tags" placeholder="逗号分隔"></label></div><label>授权或可分享依据<textarea name="license_note" required placeholder="例如：作者本人发布、CC BY 4.0、官方公开下载"></textarea></label><label>提交者<input name="submitter" placeholder="匿名"></label><div class="actions"><button type="button" id="cancel" class="ghost">取消</button><button type="submit">提交审核</button></div><p id="msg"></p></form></dialog>
<script src="/app.js"></script></body></html>
